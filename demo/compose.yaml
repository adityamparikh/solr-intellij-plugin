# Local Solr for the demo and for manual testing.
#
# Nothing in the plugin's automated tests uses this. That is a deliberate constraint from the
# implementation plan: no automated test may require a Solr that a developer started by hand, which
# is why the server work ships with a fake HTTP layer rather than depending on this file.
#
#   docker compose -f demo/compose.yaml up -d
#   docker compose -f demo/compose.yaml down -v
#
# Solr runs in SolrCloud mode, which is Solr 10's default, so the drift view's Upload and Reload
# works against it. On first start, solr/run-with-products.sh creates the `products` collection from
# a copy of ./solr/conf that repairs the planted defects and differs from the repository in four
# deliberate places, so the drift view has one of each kind of row to show. The script says which.
#
# ./solr/conf is mounted read-only and only copied. Solr never serves the repository's files, so the
# server and the repository stay two things that can disagree, which is what the drift view is for.
services:
  solr:
    # Pinned to the exact release the catalog is generated from — `supportedSolrLines` in
    # build.gradle.kts names 10.0.0. A floating `solr:10` would silently drift onto a later 10.x
    # while the plugin's vocabulary stayed put, and the demo's whole point is comparing the two.
    image: solr:10.0.0
    container_name: solr-demo
    ports:
      - "8983:8983"
    environment:
      # The name the node registers under in SolrCloud. Left alone it is the container's IP address,
      # which can change whenever the container is recreated, stranding the collection's replica on
      # a node that no longer exists. Solr 10 reads SOLR_HOST_ADVERTISE; the older SOLR_HOST is ignored.
      SOLR_HOST_ADVERTISE: localhost
    volumes:
      - solr-data:/var/solr
      - ./solr/conf:/demo/conf:ro
      - ./solr/run-with-products.sh:/demo/run-with-products.sh:ro
    command:
      - /demo/run-with-products.sh
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8983/solr/admin/info/system || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  solr-data:
