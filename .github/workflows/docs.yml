# Builds the documentation site (MkDocs Material + the Dokka API reference) and, once publishing is
# switched on, deploys it to GitHub Pages.
#
# Publishing is gated on the repository variable DOCS_PUBLISH == 'true', so merging this workflow
# builds and checks the site on every run but deploys nothing until an owner flips the switch (and
# sets Settings -> Pages -> Source to "GitHub Actions").

name: Docs
on:
  push:
    branches: [ main ]
    paths: [ 'docs/**', 'mkdocs.yml', 'site-tools/**', 'src/main/kotlin/**', '.github/workflows/docs.yml' ]
  pull_request:
    paths: [ 'docs/**', 'mkdocs.yml', 'site-tools/**', 'src/main/kotlin/**', '.github/workflows/docs.yml' ]
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: site-tools/requirements.txt

      - name: Install MkDocs
        run: pip install -r site-tools/requirements.txt

      - name: Generate API reference
        run: ./gradlew dokkaGenerate

      - name: Build site
        run: mkdocs build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DOCS_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
