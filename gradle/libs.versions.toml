# Dependency coordinates and plugin versions, in one place.
#
# Deliberately NOT here: the Solr lines in `supportedSolrLines` and the IDE target in
# `intellijIdea(...)`, both in build.gradle.kts. Those are version-*support policy* — a line is added
# or dropped by a human reading an Apache EOL announcement, not by a bot reading Maven Central — and
# a Solr line is a key/value pair (`"10" to "10.0.0"`) that a catalog cannot hold as one fact.
#
# Also not here, because Gradle cannot reach a catalog from those positions: the two plugins applied
# in settings.gradle.kts. See the comment there.

[versions]
asm = "9.11"
junit = "4.13.2"
kotlin = "2.4.21"
changelog = "2.5.0"
kover = "0.9.11"
sonarqube = "7.5.0.8588"
dokka = "2.2.0"
testcontainers = "1.21.4"
# Formatting: Google style, for Kotlin through ktfmt and for the demo's Java through
# google-java-format. Both formatters are versioned here rather than left to Spotless's defaults, so
# a Spotless bump cannot reformat the tree on its own.
spotless = "8.10.4"
ktfmt = "0.64"
# Held at 1.36.1: Spotless 8.10.4 cannot drive 1.37.0, which fails every file with a bare
# InvocationTargetException. Raise it with the Spotless that supports it.
google-java-format = "1.36.1"

[libraries]
# Consumed by buildSrc: reads Solr class files to generate the shipped class catalog.
asm = { module = "org.ow2.asm:asm", version.ref = "asm" }
junit = { module = "junit:junit", version.ref = "junit" }

# The contract tests, which are the only tier that can notice Solr changing a response shape.
# `testcontainers-solr` is the project's own module rather than a `GenericContainer` assembled here:
# it already knows the wait strategy, and `withZookeeper` is what lets one fixture answer the
# standalone-versus-SolrCloud question the server specification turns on. Its default image tag is
# ignored — every container here names a supported line explicitly.
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
testcontainers-solr = { module = "org.testcontainers:solr", version.ref = "testcontainers" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
changelog = { id = "org.jetbrains.changelog", version.ref = "changelog" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
sonarqube = { id = "org.sonarqube", version.ref = "sonarqube" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
