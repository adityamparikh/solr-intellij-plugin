        - paragraph [ref=e483]: Adds a companion field that holds a tokenized field's whole value, so it can be matched, faceted and sorted exactly.
        - paragraph [ref=e484]: A tokenized field does not keep the string a document carried. Widget Pro enters the index as widget and pro, so a filter on the whole value, a facet over it, or a sort by it all have nothing to work against — and none of them reports an error. The standard remedy is a string companion beside the text field, populated by a copyField rule, and this writes both.
