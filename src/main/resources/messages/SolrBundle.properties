query.summary.all={0} {0,choice,1#document|1<documents} matched, in {1} ms.
query.summary.window={0} {0,choice,1#document|1<documents} matched in {1} ms, showing {2} to {3}.
query.summary.unknownTotal=Showing {0} {0,choice,1#document|1<documents}.
query.hiddenFields=Solr''s internal fields are not shown: {0}
query.parsedAs=Solr read the query as: {0}
query.explanations=Why each document scored:
query.explanationFor=Document {0}

