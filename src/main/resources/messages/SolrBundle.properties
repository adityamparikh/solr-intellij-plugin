# How a schema declaration names itself when the platform puts it on screen — the Find Usages
# header and the rename dialog both read these. Without them the platform falls back to the
# target's own class name, and shows the user "Solr Declaration Target".
declaration.kind.field=field
declaration.kind.dynamicField=dynamic field
declaration.kind.fieldType=field type

# What each kind of reference is called where the usage view groups them. Without these every
# usage lands under "Unclassified", which reads as broken even when the results are right. All four
# kinds need one: nothing else in the IDE classifies a file reference sitting in an XML attribute,
# so the resource-file entry is no more optional than the rest.
usageType.fieldTypeReference=Field declaring this type
usageType.copyFieldEnd=Copy rule
usageType.handlerParameter=Handler parameter in solrconfig.xml
usageType.resourceFile=Analyzer component reading this file
